name: verify
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Full release gate
        run: pnpm run verify:release
      - name: Capture UI parity evidence
        if: ${{ failure() }}
        run: pnpm run build:demo && pnpm exec playwright test tests/e2e/legacy-ui.spec.ts --project=chromium-dev
      - name: Collect source evidence
        if: ${{ always() }}
        run: |
          mkdir -p test-results
          git archive --format=tar HEAD > test-results/source.tar
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: legacy-ui-evidence-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
