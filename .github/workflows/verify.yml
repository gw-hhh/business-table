name: verify
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package isolated verification inputs
        run: |
          mkdir -p /tmp/parity-inputs
          git archive --format=tar HEAD > /tmp/parity-inputs/source.tar
          tar -czf /tmp/parity-inputs/dependencies.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: config-runtime-verification-inputs
          path: /tmp/parity-inputs/
          retention-days: 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Full release gate
        run: pnpm run verify:release
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: config-runtime-ui-evidence
          path: test-results/
          retention-days: 7
