name: receive-filter-migration
'on':
  push:
    branches: [feature/visual-parity-refinement]
    paths: [.github/workflows/receive-filter-migration.yml]
permissions:
  contents: read
concurrency:
  group: receive-filter-migration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-commit-source:
    if: github.repository == 'gw-hhh/business-table' && github.ref == 'refs/heads/feature/visual-parity-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6225ced8d47a954239aee43d38a9e6db2ccb0d70
          cat .delivery-transfer/filter-migration/part-{00,01,02,03,04,05,06,07}.b64 | base64 --decode > /tmp/filter-source.patch.xz
          echo '7a3773f520610b81eac9b15ddef73adb97c9fab3d933f0da42210059c3f65ab4  /tmp/filter-source.patch.xz' | sha256sum -c -
          xz -dc /tmp/filter-source.patch.xz > /tmp/filter-source.patch
          echo '11255e6c82e0d8c5ea2ef74cac48cd99dcd2df5cdced9ac41123f861793f6583  /tmp/filter-source.patch' | sha256sum -c -
          git apply --index --whitespace=error /tmp/filter-source.patch
          git rm -r .delivery-transfer/filter-migration
          cp .git/index /tmp/filter-verified-index
          GIT_INDEX_FILE=/tmp/filter-verified-index git update-index --force-remove .github/workflows/receive-filter-migration.yml
          test "$(GIT_INDEX_FILE=/tmp/filter-verified-index git write-tree)" = 8b45c32c289f84e705b31e7e331017a6fc87d30c
          git diff --cached --quiet -- .github/workflows
          mkdir -p /tmp/filter-verification
          printf '%s\n' 'Reviewed source tree: 8b45c32c289f84e705b31e7e331017a6fc87d30c' 'Base: 6225ced8d47a954239aee43d38a9e6db2ccb0d70' > /tmp/filter-verification/SOURCE.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify before committing
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:release 2>&1 | tee /tmp/filter-verification/Release-Gate.log
      - name: Commit verified source on the requested feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: migrate guarded first-party column and combined filters with saved plans' -m "Full release gate passed in run $GITHUB_RUN_ID. Exact reviewed source tree 8b45c32c289f84e705b31e7e331017a6fc87d30c plus unchanged temporary receiver. Existing runtime and settings retained. This is a verified filter migration checkpoint, not complete legacy parity."
          git push origin HEAD:refs/heads/feature/visual-parity-refinement
          git rev-parse HEAD > /tmp/filter-verification/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-migration-verification
          path: |
            /tmp/filter-verification/
            test-results/
          retention-days: 14
